name: SFDX CLI Setup
description: Salesforce setup action for installing the CLI and related plugins.

branding:
  icon: terminal
  color: blue

inputs:
  plugins:
    description: Specify SF CLI plugins to be installed, e.g. "['@salesforce/plugin-packaging','sfdx-git-delta']".
    required: false
  version:
    description: Specify SF CLI version to be installed, e.g. "2.32.8".
    required: false
  step-summary:
    description: Write a result section to the GitHub Actions job summary. Set to false to avoid collisions with a custom workflow summary.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install SF CLI
      id: install-cli
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ -z "$VERSION" ]]; then
          echo "No version specified, latest SF CLI version is installed..."
          npm i -g @salesforce/cli
        else
          echo "Installing SF CLI with version $VERSION..."
          npm i -g "@salesforce/cli@$VERSION"
        fi

        cli_version=$(sf version)
        echo "$cli_version"
        echo "✅ Salesforce CLI ready"

        echo "cli-version=$cli_version" >> "$GITHUB_OUTPUT"
    - name: Install Plugins
      id: install-plugins
      if: ${{ inputs.plugins }}
      shell: bash
      env:
        PLUGINS: ${{ inputs.plugins && join(fromJSON(inputs.plugins), ' ') || '' }}
      run: |
        set -euo pipefail

        echo "Installing SF CLI plugins: $PLUGINS"

        for plugin in $PLUGINS; do
          echo "Installing plugin $plugin..."
          echo y | sf plugins install "$plugin"
        done

        sf plugins

        echo "✅ Installed SF CLI plugins: $PLUGINS"

        echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
    - name: Write job summary
      if: ${{ inputs.step-summary == 'true' }}
      shell: bash
      env:
        CLI_VERSION: ${{ steps.install-cli.outputs.cli-version }}
        PLUGINS: ${{ steps.install-plugins.outputs.plugins }}
      run: |
        set -euo pipefail

        {
          echo ""
          echo "### ⚙️ Salesforce CLI setup"
          echo ""
          echo "- **Version:** \`$CLI_VERSION\`"
          if [[ -n "$PLUGINS" ]]; then
            echo "- **Plugins:**"
            for plugin in $PLUGINS; do
              echo "  - \`$plugin\`"
            done
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
